name: Build Car Diagnostic AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        shell: pwsh
        run: |
          flutter create --platforms=windows car_diagnostic_build

      - name: Copy application files
        shell: pwsh
        run: |
          Copy-Item "pubspec.yaml" "car_diagnostic_build\pubspec.yaml" -Force
          New-Item -ItemType Directory -Force "car_diagnostic_build\lib" | Out-Null
          Copy-Item "lib\main.dart" "car_diagnostic_build\lib\main.dart" -Force

      - name: Enable Windows desktop
        shell: pwsh
        working-directory: car_diagnostic_build
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        shell: pwsh
        working-directory: car_diagnostic_build
        run: flutter pub get

      - name: Analyze project
        shell: pwsh
        working-directory: car_diagnostic_build
        run: flutter analyze

      - name: Build Windows
        shell: pwsh
        working-directory: car_diagnostic_build
        run: flutter build windows --release

      - name: Package application
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "car_diagnostic_build\build\windows\x64\runner\Release\*" `
            -DestinationPath "Car-Diagnostic-AI-Windows.zip" `
            -Force

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Car-Diagnostic-AI-Windows
          path: Car-Diagnostic-AI-Windows.zip
          if-no-files-found: error
