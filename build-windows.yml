name: Build Car Diagnostic AI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows application
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Create Flutter Windows project
        shell: pwsh
        run: |
          flutter create --platforms=windows car_diagnostic_build

      - name: Copy application files
        shell: pwsh
        run: |
          Copy-Item "pubspec.yaml" "car_diagnostic_build\pubspec.yaml" -Force

          New-Item -ItemType Directory -Force "car_diagnostic_build\lib" | Out-Null

          Copy-Item "lib\main.dart" "car_diagnostic_build\lib\main.dart" -Force

      - name: Remove default Flutter test
        shell: pwsh
        run: |
          if (Test-Path "car_diagnostic_build\test") {
            Remove-Item "car_diagnostic_build\test" -Recurse -Force
          }

      - name: Install Flutter dependencies
        shell: pwsh
        working-directory: car_diagnostic_build
        run: |
          flutter pub get

      - name: Verify Flutter project
        shell: pwsh
        working-directory: car_diagnostic_build
        run: |
          flutter doctor -v
          flutter analyze lib

      - name: Build Windows application
        shell: pwsh
        working-directory: car_diagnostic_build
        run: |
          flutter build windows --release

      - name: Verify Windows build
        shell: pwsh
        run: |
          $buildPath = "car_diagnostic_build\build\windows\x64\runner\Release"

          if (!(Test-Path $buildPath)) {
            Write-Error "Windows build folder was not created."
            exit 1
          }

          $exe = Get-ChildItem $buildPath -Filter "*.exe" -Recurse

          if ($exe.Count -eq 0) {
            Write-Error "Windows executable was not found."
            exit 1
          }

          Write-Host "Windows executable found:"
          $exe | ForEach-Object {
            Write-Host $_.FullName
          }

      - name: Package Windows application
        shell: pwsh
        run: |
          $releasePath = "car_diagnostic_build\build\windows\x64\runner\Release"

          if (!(Test-Path $releasePath)) {
            Write-Error "Release folder does not exist."
            exit 1
          }

          Compress-Archive `
            -Path "$releasePath\*" `
            -DestinationPath "Car-Diagnostic-AI-Windows.zip" `
            -Force

      - name: Show package information
        shell: pwsh
        run: |
          if (!(Test-Path "Car-Diagnostic-AI-Windows.zip")) {
            Write-Error "ZIP package was not created."
            exit 1
          }

          $file = Get-Item "Car-Diagnostic-AI-Windows.zip"

          Write-Host "=========================================="
          Write-Host "CAR DIAGNOSTIC AI BUILD COMPLETE"
          Write-Host "=========================================="
          Write-Host "Package: $($file.Name)"
          Write-Host "Size: $([math]::Round($file.Length / 1MB, 2)) MB"
          Write-Host "=========================================="

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: Car-Diagnostic-AI-Windows
          path: Car-Diagnostic-AI-Windows.zip
          if-no-files-found: error
          retention-days: 30
