name: Build Car Diagnostic AI

on:
  push:
    branches:
      - main

  workflow_dispatch:


jobs:

  build-windows:

    name: Build Windows application

    runs-on: windows-latest


    steps:


      # ============================
      # CHECKOUT
      # ============================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ============================
      # FLUTTER
      # ============================

      - name: Install Flutter

        uses: subosito/flutter-action@v2

        with:

          channel: stable


      - name: Show Flutter version

        run: flutter --version


      # ============================
      # ENABLE WINDOWS
      # ============================

      - name: Enable Windows desktop

        shell: pwsh

        run: |

          flutter config --enable-windows-desktop


      # ============================
      # CREATE WINDOWS PROJECT
      # ============================

      - name: Create Windows platform

        shell: pwsh

        run: |

          if (!(Test-Path "windows")) {

            flutter create --platforms=windows .

          }


      # ============================
      # VERIFY FILES
      # ============================

      - name: Verify project files

        shell: pwsh

        run: |

          Write-Host ""

          Write-Host "Checking project files..."

          $files = @(

            "lib\main.dart",

            "lib\models.dart",

            "lib\database.dart",

            "assets\data\vehicles.json",

            "assets\data\diagnostic_data.json",

            "pubspec.yaml"

          )


          foreach ($file in $files) {

            if (!(Test-Path $file)) {

              Write-Error "FILE NOT FOUND: $file"

              exit 1

            }

            Write-Host "FOUND: $file"

          }


          Write-Host ""

          Write-Host "All required files found."


      # ============================
      # GET DEPENDENCIES
      # ============================

      - name: Install dependencies

        shell: pwsh

        run: |

          flutter pub get


      # ============================
      # ANALYZE
      # ============================

      - name: Analyze project

        shell: pwsh

        run: |

          flutter analyze


      # ============================
      # BUILD
      # ============================

      - name: Build Windows application

        shell: pwsh

        run: |

          flutter build windows --release


      # ============================
      # VERIFY BUILD
      # ============================

      - name: Verify Windows executable

        shell: pwsh

        run: |

          $releasePath = "build\windows\x64\runner\Release"


          if (!(Test-Path $releasePath)) {

            Write-Error "Release folder was not created."

            exit 1

          }


          $exeFiles = Get-ChildItem `

            -Path $releasePath `

            -Filter "*.exe" `

            -Recurse


          if ($exeFiles.Count -eq 0) {

            Write-Error "No Windows executable found."

            exit 1

          }


          Write-Host ""

          Write-Host "======================================"

          Write-Host "WINDOWS BUILD SUCCESSFUL"

          Write-Host "======================================"


          foreach ($exe in $exeFiles) {

            Write-Host "EXE: $($exe.FullName)"

          }


          Write-Host "======================================"


      # ============================
      # CREATE ZIP
      # ============================

      - name: Create ZIP package

        shell: pwsh

        run: |

          $releasePath = "build\windows\x64\runner\Release"


          if (!(Test-Path $releasePath)) {

            Write-Error "Release folder not found."

            exit 1

          }


          if (Test-Path "Car-Diagnostic-AI-Windows.zip") {

            Remove-Item `

              "Car-Diagnostic-AI-Windows.zip" `

              -Force

          }


          Compress-Archive `

            -Path "$releasePath\*" `

            -DestinationPath "Car-Diagnostic-AI-Windows.zip" `

            -Force


      # ============================
      # UPLOAD
      # ============================

      - name: Upload Windows application

        uses: actions/upload-artifact@v4

        with:

          name: Car-Diagnostic-AI-Windows

          path: Car-Diagnostic-AI-Windows.zip

          if-no-files-found: error

          retention-days: 30
