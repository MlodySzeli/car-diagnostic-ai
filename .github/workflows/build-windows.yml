name: Build Car Diagnostic AI

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows application

    runs-on: windows-latest

    steps:

      # ============================
      # CHECKOUT REPOSITORY
      # ============================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================
      # INSTALL FLUTTER
      # ============================

      - name: Install Flutter
        uses: subosito/flutter-action@v2

        with:
          channel: stable


      # ============================
      # SHOW FLUTTER VERSION
      # ============================

      - name: Show Flutter version
        shell: pwsh

        run: |
          flutter --version


      # ============================
      # CREATE WINDOWS PROJECT
      # ============================

      - name: Create Flutter Windows project
        shell: pwsh

        run: |
          flutter create --platforms=windows car_diagnostic_build


      # ============================
      # COPY PUBSPEC
      # ============================

      - name: Copy pubspec.yaml
        shell: pwsh

        run: |
          Copy-Item `
            "pubspec.yaml" `
            "car_diagnostic_build\pubspec.yaml" `
            -Force


      # ============================
      # COPY ENTIRE LIB FOLDER
      # ============================

      - name: Copy application source files
        shell: pwsh

        run: |
          if (Test-Path "car_diagnostic_build\lib") {
            Remove-Item `
              "car_diagnostic_build\lib" `
              -Recurse `
              -Force
          }

          Copy-Item `
            "lib" `
            "car_diagnostic_build\lib" `
            -Recurse `
            -Force


      # ============================
      # COPY ASSETS
      # ============================

      - name: Copy application assets
        shell: pwsh

        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            "car_diagnostic_build\assets" `
            | Out-Null

          Copy-Item `
            "assets\data" `
            "car_diagnostic_build\assets\data" `
            -Recurse `
            -Force


      # ============================
      # VERIFY FILES
      # ============================

      - name: Verify application files
        shell: pwsh

        run: |
          Write-Host ""
          Write-Host "Checking application files..."
          Write-Host ""

          $files = @(

            "car_diagnostic_build\pubspec.yaml",

            "car_diagnostic_build\lib\main.dart",

            "car_diagnostic_build\lib\models.dart",

            "car_diagnostic_build\lib\database.dart",

            "car_diagnostic_build\lib\services\dtc_service.dart",

            "car_diagnostic_build\lib\services\internet_service.dart",

            "car_diagnostic_build\assets\data\vehicles.json",

            "car_diagnostic_build\assets\data\diagnostic_data.json"

          )

          foreach ($file in $files) {

            if (!(Test-Path $file)) {

              Write-Error "FILE NOT FOUND: $file"

              exit 1

            }

            Write-Host "FOUND: $file"

          }

          Write-Host ""
          Write-Host "All application files found successfully."


      # ============================
      # REMOVE DEFAULT TEST
      # ============================

      - name: Remove default Flutter test
        shell: pwsh

        run: |
          if (Test-Path "car_diagnostic_build\test") {

            Remove-Item `
              "car_diagnostic_build\test" `
              -Recurse `
              -Force

          }


      # ============================
      # INSTALL DEPENDENCIES
      # ============================

      - name: Install dependencies
        shell: pwsh

        working-directory: car_diagnostic_build

        run: |
          flutter pub get


      # ============================
      # ANALYZE PROJECT
      # ============================

      - name: Analyze Flutter project
        shell: pwsh

        working-directory: car_diagnostic_build

        run: |
          flutter analyze


      # ============================
      # BUILD WINDOWS
      # ============================

      - name: Build Windows application
        shell: pwsh

        working-directory: car_diagnostic_build

        run: |
          flutter build windows --release


      # ============================
      # VERIFY EXECUTABLE
      # ============================

      - name: Verify Windows executable
        shell: pwsh

        run: |
          $releasePath = `
            "car_diagnostic_build\build\windows\x64\runner\Release"

          if (!(Test-Path $releasePath)) {

            Write-Error `
              "Windows Release folder was not created."

            exit 1

          }

          $exeFiles = Get-ChildItem `
            -Path $releasePath `
            -Filter "*.exe" `
            -Recurse

          if ($exeFiles.Count -eq 0) {

            Write-Error `
              "No Windows executable was found."

            exit 1

          }

          Write-Host ""

          Write-Host "========================================"

          Write-Host "WINDOWS BUILD SUCCESSFUL"

          Write-Host "========================================"

          foreach ($exe in $exeFiles) {

            Write-Host "EXE: $($exe.FullName)"

          }

          Write-Host "========================================"


      # ============================
      # CREATE ZIP
      # ============================

      - name: Create ZIP package
        shell: pwsh

        run: |
          $releasePath = `
            "car_diagnostic_build\build\windows\x64\runner\Release"

          if (!(Test-Path $releasePath)) {

            Write-Error `
              "Release folder does not exist."

            exit 1

          }

          if (Test-Path "Car-Diagnostic-AI-Windows.zip") {

            Remove-Item `
              "Car-Diagnostic-AI-Windows.zip" `
              -Force

          }

          Compress-Archive `
            -Path "$releasePath\*" `
            -DestinationPath "Car-Diagnostic-AI-Windows.zip" `
            -Force


      # ============================
      # VERIFY ZIP
      # ============================

      - name: Verify ZIP package
        shell: pwsh

        run: |
          if (!(Test-Path "Car-Diagnostic-AI-Windows.zip")) {

            Write-Error `
              "ZIP package was not created."

            exit 1

          }

          $zip = Get-Item `
            "Car-Diagnostic-AI-Windows.zip"

          Write-Host ""

          Write-Host "========================================"

          Write-Host "PACKAGE CREATED"

          Write-Host "========================================"

          Write-Host "File: $($zip.Name)"

          Write-Host `
            "Size: $([math]::Round($zip.Length / 1MB, 2)) MB"

          Write-Host "========================================"


      # ============================
      # UPLOAD ARTIFACT
      # ============================

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4

        with:

          name: Car-Diagnostic-AI-Windows

          path: Car-Diagnostic-AI-Windows.zip

          if-no-files-found: error

          retention-days: 30
